<html lang="hu">
<head>

<title>Akkordkönyv</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,700&display=swap">
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a1a;--panel:#1d2525;--ink:#e6eeec;--mute:#93a7a4;--line:#344341;--acc:#e8909f;--accink:#1a1012;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a1a;--panel:#1d2525;--ink:#e6eeec;--mute:#93a7a4;--line:#344341;--acc:#e8909f;--accink:#1a1012;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Literata,Georgia,'Times New Roman',serif;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 120px}
h1{font-size:1.4rem;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
select,button,input,textarea{font:inherit;color:inherit}
select,input[type=text],textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
select{font-size:16px}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 13px;min-height:44px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
button.del{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grow{flex:1;min-width:150px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.grp{display:flex;align-items:center;gap:6px}
.grp span{color:var(--mute);font-size:.88rem}
.grp b{min-width:2.2em;text-align:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 16px}
.sheet h2{margin:0 0 16px;font-size:1.3rem}
.line{display:flex;flex-wrap:wrap;margin-bottom:.9em;font-size:var(--fs,18px)}
.seg{display:inline-flex;flex-direction:column;white-space:pre-wrap}
.ch{color:var(--acc);font-weight:700;padding-right:.35em;min-height:1.5em;font-size:.92em}
.ly{min-height:1.5em}
.sec{margin:1.3em 0 .5em;font-style:italic;color:var(--mute);font-size:var(--fs,18px)}
.plain{font-size:var(--fs,18px);min-height:1.5em;white-space:pre-wrap}
.gap{height:.8em}
.imgw{overflow-x:auto}
.imgw img{display:block;max-width:none;height:auto}
.edit{display:grid;gap:10px}
.edit textarea{min-height:60vh;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;line-height:1.55;resize:vertical}
.hint,#msg{color:var(--mute);font-size:.88rem;margin:0}
#msg{min-height:1.3em;margin-bottom:8px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:6px 14px 6px 6px;box-shadow:0 4px 18px rgba(0,0,0,.22);z-index:5}
.fab input{width:120px;accent-color:var(--acc)}
.fab span{font-size:.85rem;color:var(--mute)}
</style>
</head>

var st={songs:[],cur:null,shift:0,flat:false,fs:18,editing:false,play:false,spd:3,hu:false,dirty:false};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function note(t){$("msg").textContent=t||""}
/* tárolás: IndexedDB (a képek miatt) */
var DB=null;
function openDB(){return new Promise(function(res){try{var r=indexedDB.open("akkordkonyv",1);
r.onupgradeneeded=function(){r.result.createObjectStore("songs",{keyPath:"id"})};
r.onsuccess=function(){DB=r.result;res()};r.onerror=function(){res()}}catch(e){res()}})}
function dbAll(){return new Promise(function(res){if(!DB)return res([]);try{var q=DB.transaction("songs").objectStore("songs").getAll();
q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}}catch(e){res([])}})}
function dbPut(s){setDirty(true);if(!DB)return;try{DB.transaction("songs","readwrite").objectStore("songs").put(s)}catch(e){note("A mentés nem sikerült (kevés a hely?).")}}
function dbDel(id){setDirty(true);if(!DB)return;try{DB.transaction("songs","readwrite").objectStore("songs").delete(id)}catch(e){}}
function uid(){return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function nextOrd(){return st.songs.reduce(function(m,s){return Math.max(m,s.ord||0)},0)+1}
/* hangnem */
function semi(n){if(st.hu&&n=="B")return 10;return NS.indexOf(ALT[n]||n)}
function nm(i,fl){var T=fl?NF:NS,n=T[i];if(st.hu){if(i==11)return "H";if(i==10)return "B"}return n}
function tr(c,k,fl){if(!k)return c;var m=c.match(CRE);if(!m||semi(m[1])<0)return c;
var o=nm((semi(m[1])+k+120)%12,fl)+m[2];if(m[3]&&semi(m[3])>=0)o+="/"+nm((semi(m[3])+k+120)%12,fl);return o}
/* megjelenítés */
function cur(){return st.songs.filter(function(s){return s.id==st.cur})[0]}
function fillSel(){st.songs.sort(function(a,b){return (a.ord||0)-(b.ord||0)});
$("sel").innerHTML=st.songs.map(function(s){return '<option value="'+s.id+'"'+(s.id==st.cur?" selected":"")+">"+(s.type=="image"?"🖼 ":"")+esc(s.title||"Névtelen dal")+"</option>"}).join("")}
function view(){var s=cur();st.hu=/\[H/.test(s.text||"");var h='<article class="sheet" style="--fs:'+st.fs+'px"><h2>'+esc(s.title||"Névtelen dal")+"</h2>";
$("sh").textContent=(st.shift>0?"+":"")+st.shift;$("fl").textContent=st.flat?"♭":"♯";
if(s.type=="image"){h+='<div class="imgw"><img alt="'+esc(s.title)+'" src="'+s.img+'" style="width:'+Math.round(st.fs/18*100)+'%"></div>'}
else{(s.text||"").split("\n").forEach(function(ln){
if(/^\s*$/.test(ln)){h+='<div class="gap"></div>';return}
if(ln.charAt(0)=="#"){h+='<div class="sec">'+esc(ln.replace(/^#+\s*/,""))+"</div>";return}
if(/^\s*(V\d*|R\d*|H|B|I|RAP ?\d*|Szerkezet \/ Sorrend:?)\s*:?\s*$/i.test(ln)){h+='<div class="sec">'+esc(ln.trim())+"</div>";return}
if(ln.indexOf("[")<0){h+='<div class="plain">'+esc(ln)+"</div>";return}
h+='<div class="line">';
ln.split(/(\[[^\]]+\])/).forEach(function(t,i,a){
if(/^\[[^\]]+\]$/.test(t)){h+='<span class="seg"><b class="ch">'+esc(tr(t.slice(1,-1),st.shift,st.flat))+'</b><span class="ly">'+esc(a[i+1]||"")+"</span></span>"}
else if(i==0&&t){h+='<span class="seg"><b class="ch"> </b><span class="ly">'+esc(t)+"</span></span>"}});
h+="</div>"})}
$("main").innerHTML=h+"</article>"}
function editView(){var s=cur();
$("main").innerHTML='<div class="edit"><input type="text" id="t" placeholder="A dal címe" value="'+esc(s.title)+'"><textarea id="x" spellcheck="false" placeholder="[C]Dalszöveg [G]akkordokkal">'+esc(s.text||"")+'</textarea>'
+'<p class="hint">Az akkordot szögletes zárójelbe írd a szótag elé: [Am]. Angol jelölés (B = si). A „# Refrén” sor szakaszcím. Csak olyan dalt mentsd el, amelyhez van jogod.</p>'
+'<div class="bar"><button id="sv" class="pri">Mentés</button><button id="cn">Mégse</button></div></div>';
$("sv").onclick=function(){s.title=$("t").value.trim();s.text=$("x").value;dbPut(s);st.editing=false;st.shift=0;draw()};
$("cn").onclick=function(){if(s.isNew&&!s.title&&!s.text)removeSong(s);st.editing=false;draw()}}
function draw(){setPlay(false);fillSel();var e=st.editing;
$("tools").style.display=e?"none":"";$("fab").style.display=e?"none":"";
if(e)editView();else view();window.scrollTo(0,0)}
function removeSong(s){st.songs=st.songs.filter(function(z){return z!==s});dbDel(s.id);
if(!st.songs.length){st.songs=[SAMPLE];dbPut(SAMPLE)}st.cur=st.songs[0].id}
/* fájlok betöltése (txt, kép) természetes sorrendben */
function shrink(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();
im.onload=function(){var k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");
c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.85))};
im.onerror=function(){URL.revokeObjectURL(u);rej()};im.src=u})}
async function importFiles(fl){var arr=Array.from(fl).sort(function(a,b){return a.name.localeCompare(b.name,"hu",{numeric:true,sensitivity:"base"})});
var added=0,skip=0,last=null;note("Betöltés…");
for(var i=0;i<arr.length;i++){var f=arr[i],title=f.name.replace(/\.[^.]+$/,"").replace(/_/g," ");
if(st.songs.some(function(s){return s.title.toLowerCase()==title.toLowerCase()})){skip++;continue}
var s={id:uid(),title:title,ord:nextOrd()};
try{if(/\.txt$/i.test(f.name)||f.type=="text/plain"){s.type="text";s.text=await f.text()}
else if(/^image\//.test(f.type)||/\.(png|jpe?g|webp)$/i.test(f.name)){s.type="image";s.img=await shrink(f)}
else{skip++;continue}}catch(e){skip++;continue}
st.songs.push(s);dbPut(s);added++;last=s}
if(last){st.cur=last.id;st.shift=0}
note(added+" fájl betöltve"+(skip?", "+skip+" kihagyva (már megvan vagy nem támogatott)":"")+".");draw()}
/* automatikus görgetés */
var lastT=0,acc=0,touching=false,wl=null;
function loop(t){if(!st.play)return;var dt=Math.min(0.1,(t-lastT)/1000);lastT=t;
if(!touching){acc+=dt*st.spd*9;var n=Math.floor(acc);if(n>0){acc-=n;window.scrollBy(0,n)}}
if(window.innerHeight+window.pageYOffset>=document.documentElement.scrollHeight-2){setPlay(false);return}
requestAnimationFrame(loop)}
function setPlay(on){if(on==st.play)return;st.play=on;$("play").textContent=on?"⏸ Megállít":"▶ Görgetés";
if(on){lastT=performance.now();acc=0;requestAnimationFrame(loop);
try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}}
else{try{if(wl){wl.release();wl=null}}catch(e){}}}
document.addEventListener("touchstart",function(){touching=true},{passive:true});
document.addEventListener("touchend",function(){touching=false},{passive:true});
document.addEventListener("touchcancel",function(){touching=false},{passive:true});
document.addEventListener("keydown",function(e){if(e.code=="Space"&&!st.editing&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();setPlay(!st.play)}});
/* események */
$("sel").onchange=function(){st.cur=this.value;st.shift=0;st.editing=false;note("");draw()};
$("imp").onclick=function(){$("fi").click()};
$("fi").onchange=function(){if(this.files.length)importFiles(this.files);this.value=""};
$("new").onclick=function(){var s={id:uid(),title:"",text:"",type:"text",ord:nextOrd(),isNew:true};st.songs.push(s);st.cur=s.id;st.shift=0;st.editing=true;draw()};
$("ed").onclick=function(){var s=cur();if(s.type=="image"){var n=prompt("A kép új címe:",s.title);if(n!==null){s.title=n.trim();dbPut(s);draw()}return}st.editing=true;draw()};
$("del").onclick=function(){if(!confirm("Biztosan törlöd ezt a dalt?"))return;removeSong(cur());st.shift=0;st.editing=false;draw()};
$("up").onclick=function(){st.shift=((st.shift+1+5)%12)-5;view()};
$("dn").onclick=function(){st.shift=((st.shift-1+5+12)%12)-5;view()};
$("fl").onclick=function(){st.flat=!st.flat;view()};
function fsz(d){st.fs=Math.max(13,Math.min(40,st.fs+d));try{localStorage.setItem("akk.fs",st.fs)}catch(e){}view()}
$("fp").onclick=function(){fsz(2)};$("fm").onclick=function(){fsz(-2)};
$("play").onclick=function(){setPlay(!st.play)};
$("spd").oninput=function(){st.spd=+this.value};
/* songs.json be- és kimenet */
function setDirty(v){st.dirty=v;var b=$("xjson");if(b)b.textContent="Mentés songs.json-ba"+(v?" ●":"")}
function normalize(arr,base){var out=[];(arr||[]).forEach(function(o,i){if(!o||typeof o!="object")return;
var img=o.type=="image";if(img&&!o.img)return;
var s={id:uid(),title:String(o.title||"").trim(),type:img?"image":"text",ord:(base||0)+i+1};
if(img)s.img=o.img;else s.text=String(o.text||"");out.push(s)});return out}
async function importJSON(f){var data;try{data=JSON.parse(await f.text())}catch(e){note("Ez nem érvényes JSON fájl.");return}
if(!Array.isArray(data)){note("A fájl nem dallista.");return}
var inc=normalize(data,nextOrd()),added=0,upd=0;
inc.forEach(function(n){var ex=st.songs.filter(function(s){return s.title.toLowerCase()==n.title.toLowerCase()})[0];
if(ex){ex.type=n.type;ex.text=n.text;ex.img=n.img;dbPut(ex);upd++}else{st.songs.push(n);dbPut(n);added++}});
var sk=data.length-inc.length;
note(added+" új és "+upd+" frissített dal betöltve"+(sk?", "+sk+" kihagyva":"")+".");setDirty(false);draw()}
function exportJSON(){var data=st.songs.slice().sort(function(a,b){return (a.ord||0)-(b.ord||0)}).map(function(s){
var o={title:s.title,type:s.type||"text"};if(o.type=="image")o.img=s.img;else o.text=s.text||"";return o});
var json=JSON.stringify(data,null,2),file=new File([json],"songs.json",{type:"application/json"});
function dl(){var a=document.createElement("a");a.href=URL.createObjectURL(file);a.download="songs.json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);note("A songs.json letöltve.");setDirty(false)}
if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"songs.json"}).then(function(){note("A songs.json elmentve.");setDirty(false)}).catch(function(e){if(!e||e.name!="AbortError")dl()})}else dl()}
$("ljson").onclick=function(){$("jfi").click()};
$("jfi").onchange=function(){if(this.files.length)importJSON(this.files[0]);this.value=""};
$("xjson").onclick=exportJSON;
(async function(){try{var f=localStorage.getItem("akk.fs");if(f)st.fs=+f}catch(e){}
await openDB();st.songs=await dbAll();
if(!st.songs.length||(st.songs.length==1&&st.songs[0].id=="sample")){if(st.songs.length)dbDel("sample");st.songs=normalize(SEED);if(!st.songs.length)st.songs=[SAMPLE];st.songs.forEach(function(s){dbPut(s)});setDirty(false)}
st.cur=st.songs.sort(function(a,b){return (a.ord||0)-(b.ord||0)})[0].id;draw()})();
</script>
