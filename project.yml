name: Akkordkonyv
options:
  bundleIdPrefix: hu.akkordkonyv
  deploymentTarget:
    iOS: "16.0"
targets:
  Akkordkonyv:
    type: application
    platform: iOS
    sources:
      - Akkordkonyv
    info:
      path: Akkordkonyv/Info.plist
      properties:
        CFBundleDisplayName: Akkordkönyv
        UILaunchScreen: {}
        UIFileSharingEnabled: true               # a Fájlok appban látszik a mappa
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.akkordkonyv.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
