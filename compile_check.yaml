  compile-check:
    name: Fordítás ellenőrzése
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Xcode-projekt generálása
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build szimulátorra (aláírás nélkül)
        script: |
          xcodebuild -project Akkordkonyv.xcodeproj \
            -scheme Akkordkonyv \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
