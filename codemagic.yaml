workflows:
  compile-check:
    name: Fordítás ellenőrzése
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Xcode-projekt generálása
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build szimulátorra (aláírás nélkül)
        script: |
          xcodebuild -project Akkordkonyv.xcodeproj \
            -scheme Akkordkonyv \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  unsigned-ipa:
    name: Aláíratlan IPA
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Xcode-projekt generálása
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build eszközre, aláírás nélkül
        script: |
          xcodebuild -project Akkordkonyv.xcodeproj \
            -scheme Akkordkonyv \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: IPA csomagolása
        script: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Akkordkonyv.app Payload/
          zip -r Akkordkonyv.ipa Payload
    artifacts:
      - Akkordkonyv.ipa
