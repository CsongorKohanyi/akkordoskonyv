workflows:
  ios-workflow:
    name: Akkordkönyv iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Codemagic      # a Codemagic-ben létrehozott App Store Connect integráció neve
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: hu.akkordkonyv.app
    scripts:
      - name: Xcode-projekt generálása (XcodeGen)
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Aláíró profilok beállítása
        script: xcode-project use-profiles
      - name: Build számláló növelése
        script: |
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: IPA építése
        script: |
          xcode-project build-ipa \
            --project "Akkordkonyv.xcodeproj" \
            --scheme "Akkordkonyv"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
